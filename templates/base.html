<style>
/* ── ShotGeek collision loader ─────────────────────────────── */
.sg-loader-stage {
    position: relative;
    width: 360px;
    height: 120px;
}

.sg-ball {
    position: absolute;
    width: 110px;
    height: 110px;
    top: 5px;
}

/* Center navbar logo in the middle of the page */
.sg-navbar-centered {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.sg-navbar-centered .navbar-brand {
    margin: 0;
    padding-top: 0.5rem;
    padding-bottom: 0.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
}

.sg-logo-tagline {
    margin-top: 0.15rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #00284D;
    line-height: 1;
}

.sg-navbar-centered .navbar-toggler {
    position: absolute;
    right: 0.75rem;
}

#sg-ball-orange {
    left: 0;
    animation: sg-roll-in-left 1.2s ease-in-out infinite;
    transform-origin: center center;
}

#sg-ball-navy {
    right: 0;
    animation: sg-roll-in-right 1.2s ease-in-out infinite;
    transform-origin: center center;
}

@keyframes sg-roll-in-left {
    0%   { transform: translateX(0)     rotate(0deg); }
    42%  { transform: translateX(125px) rotate(200deg); }
    50%  { transform: translateX(120px) rotate(210deg) scale(1.12, 0.82); }
    100% { transform: translateX(0)     rotate(0deg); }
}

@keyframes sg-roll-in-right {
    0%   { transform: translateX(0)      rotate(0deg); }
    42%  { transform: translateX(-125px) rotate(-200deg); }
    50%  { transform: translateX(-120px) rotate(-210deg) scale(1.12, 0.82); }
    100% { transform: translateX(0)      rotate(0deg); }
}
</style>

<script>
// Fill the nearest input from the autocomplete dropdown and clear results.
// Uses mousedown so it fires before the input's blur event.
function sgAcSelect(item, name) {
    var wrap = item.closest('.position-relative');
    var input = wrap && wrap.querySelector('input');
    if (input) input.value = name;
    // Clear all autocomplete result containers inside this wrapper
    wrap && wrap.querySelectorAll('[id^="autocomplete-results"]').forEach(function(el) {
        el.innerHTML = '';
    });
}

// Close all autocomplete dropdowns when clicking outside a search wrapper
document.addEventListener('click', function(e) {
    if (!e.target.closest('.position-relative')) {
        document.querySelectorAll('[id^="autocomplete-results"]').forEach(function(el) {
            el.innerHTML = '';
        });
    }
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // Show loader and set a max timeout to hide it
    const showLoader = () => {
        const loader = document.getElementById('loader');
        loader.style.display = 'block';

        // Hide the loader after 10 seconds (10000ms)
        setTimeout(() => {
            loader.style.display = 'none';
        }, 5000);
    };

    // Add click event listeners to all buttons
    document.querySelectorAll('button').forEach(function(button) {
        // check if link has noloader class. If it does, don't show loader.
        // this is to prevent loader from showing for buttons that do not load
        // anything, like the navbar hamburger menu
        if (button.classList.contains('noloader')) {
            return;
        }
        button.addEventListener('click', showLoader);
    });

    // Add click event listeners to all anchor links
    document.querySelectorAll('a').forEach(function(link) {
        // check if link has noloader class. If it does, don't show loader.
        if (link.classList.contains('noloader')) {
            return;
        }
        link.addEventListener('click', function(event) {
            // Only show loader for internal or same-origin links
            if (
                link.href &&
                !link.href.startsWith('mailto:') &&
                !link.href.startsWith('tel:') &&
                link.origin === window.location.origin
            ) {
                console.log('@@ Test loader')
                showLoader();
            }
        });
    });

    // For htmx requests (if using htmx for AJAX calls)
    // Moved this in here, because it wasn't unloading which was awkward:
    // the loader was showing for a long time even when UI changes
    // were already visible on screen.
    document.addEventListener('htmx:configRequest', showLoader);
    document.addEventListener('htmx:afterOnLoad', function() {
        console.log('@@ htmx:afterOnLoad');
        document.getElementById('loader').style.display = 'none';
    });
});
</script>
